name: Deploy Infrastructure
concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy-infra.yml'
      - 'infra/**'
      - '!infra/EEGProcessingStateMachine.asl.json'  # Exclude ASL file
      - '!**/*.md'
      - 'src/lambdas/**'  # Include Lambda source code
      - 'samconfig.toml'  # Include SAM configuration file

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-west-2
      STACK_NAME: AI4NG-T1-Training-dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Install SAM CLI
      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # Get all required exported values
      - name: Get CloudFormation exports
        id: get_exports
        run: |
          echo "Fetching CloudFormation exports..."
          BUCKET_NAME=$(aws cloudformation list-exports \
            --query "Exports[?Name=='EEGUploadBucketName'].Value" \
            --output text)
          
          if [ -z "$BUCKET_NAME" ]; then
            echo "::error::EEGUploadBucketName export not found"
            exit 1
          fi

          SHARED_API_ID=$(aws cloudformation list-exports \
            --query "Exports[?Name=='SharedApiId'].Value" \
            --output text)
          if [ -z "$SHARED_API_ID" ]; then
            echo "::error::SharedApiId export not found"
            exit 1 
          fi

          SG_ID=$(aws cloudformation list-exports \
            --query "Exports[?Name=='NetworkStack-PrivateSG'].Value" \
            --output text)

          if [ -z "$SG_ID" ]; then
            echo "::error::NetworkStack-PrivateSG export not found"
            exit 1
          fi

          SUBNETS_STRING=$(aws cloudformation list-exports \
            --query "Exports[?Name=='NetworkStack-PrivateSubnetIds'].Value" \
            --output text)

          if [ -z "$SUBNETS_STRING" ]; then
            echo "::error::NetworkStack-PrivateSubnetIds export not found"
            exit 1
          fi   

          SUBNET1=$(echo "$SUBNETS_STRING" | cut -d',' -f1)
          SUBNET2=$(echo "$SUBNETS_STRING" | cut -d',' -f2)
          
          if [ -z "$SUBNET1" ] || [ -z "$SUBNET2" ]; then
            echo "::error::Could not parse subnets from: $SUBNETS_STRING"
            exit 1
          fi          

          echo "Successfully fetched all required exports:"
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "shared_api_id=$SHARED_API_ID" >> $GITHUB_OUTPUT
          echo "sg_id=$SG_ID" >> $GITHUB_OUTPUT
          echo "subnet1_id=$SUBNET1" >> $GITHUB_OUTPUT
          echo "subnet2_id=$SUBNET2" >> $GITHUB_OUTPUT

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Compute DynamoDB GSI changes
        id: gsi_delta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TPL="infra/trainingPipelineTemplate.yaml"
          
          # Find last successful deployment commit
          echo "::notice::Checking for successful runs on branch: ${{ github.ref_name }}"
          
          # Try main branch first, then current branch
          LAST_SUCCESS_COMMIT=$(gh run list --workflow deploy-infra.yml --branch main --limit 50 --json conclusion,headSha --jq 'map(select(.conclusion == "success")) | .[0].headSha' 2>/dev/null || echo "")
          
          if [ -z "$LAST_SUCCESS_COMMIT" ] || [ "$LAST_SUCCESS_COMMIT" = "null" ]; then
            LAST_SUCCESS_COMMIT=$(gh run list --workflow deploy-infra.yml --branch ${{ github.ref_name }} --limit 50 --json conclusion,headSha --jq 'map(select(.conclusion == "success")) | .[0].headSha' 2>/dev/null || echo "")
          fi
          
          echo "::notice::Last success commit result: '$LAST_SUCCESS_COMMIT'"
          
          if [ -n "$LAST_SUCCESS_COMMIT" ] && [ "$LAST_SUCCESS_COMMIT" != "null" ] && [ "$LAST_SUCCESS_COMMIT" != "" ]; then
            echo "::notice::Found last successful deployment: $LAST_SUCCESS_COMMIT"
          else
            # No successful runs found, skip GSI sequencing for safety
            echo "::notice::No successful deployment found - skipping GSI sequencing"
            echo "has_gsi_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Debug: check if commit exists and what files are available
          echo "::notice::Checking commit $LAST_SUCCESS_COMMIT"
          git show --name-only "$LAST_SUCCESS_COMMIT" | head -10 || echo "Failed to show commit"
          
          # Try to get the template from the commit
          echo "::notice::Attempting to retrieve template: $LAST_SUCCESS_COMMIT:${TPL}"
          if git show "$LAST_SUCCESS_COMMIT:${TPL}" > /tmp/base.yaml 2>&1; then
            echo "::notice::Successfully retrieved template from commit"
          else
            echo "::notice::Failed to retrieve template. Git show output:"
            git show "$LAST_SUCCESS_COMMIT:${TPL}" 2>&1 || true
            echo "::notice::Template not found at $TPL - skipping GSI sequencing"
            echo "has_gsi_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          cp "$TPL" /tmp/head.yaml
          
          # Get all DynamoDB tables
          get_tables() {
            yq '.Resources | to_entries | map(select(.value.Type == "AWS::DynamoDB::Table")) | .[].key' -r "$1" 2>/dev/null || true
          }
          
          BASE_TABLES=$(get_tables /tmp/base.yaml)
          HEAD_TABLES=$(get_tables /tmp/head.yaml)
          
          # Check if only table names changed (skip GSI sequencing for table renames)
          DIFF_OUTPUT=$(git diff "$LAST_SUCCESS_COMMIT" HEAD -- "$TPL")
          if echo "$DIFF_OUTPUT" | grep -q "^-.*TableName:" && echo "$DIFF_OUTPUT" | grep -q "^+.*TableName:" && ! echo "$DIFF_OUTPUT" | grep -qE "(GlobalSecondaryIndexes|AttributeDefinitions)"; then
            echo "::notice::Only table name changes detected - skipping GSI sequencing"
            echo "has_gsi_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Check if any table has GSI or AttributeDefinitions changes
          HAS_GSI_CHANGES=false
          for table in $HEAD_TABLES; do
            # Skip if table doesn't exist in base (new table)
            if ! yq ".Resources.${table}" /tmp/base.yaml >/dev/null 2>&1; then
              echo "::notice::Table $table is new - skipping GSI sequencing for this table"
              continue
            fi
            
            BASE_GSIS=$(yq ".Resources.${table}.Properties.GlobalSecondaryIndexes[].IndexName" /tmp/base.yaml 2>/dev/null | sort || true)
            HEAD_GSIS=$(yq ".Resources.${table}.Properties.GlobalSecondaryIndexes[].IndexName" /tmp/head.yaml 2>/dev/null | sort || true)
            
            BASE_ATTRS=$(yq ".Resources.${table}.Properties.AttributeDefinitions[].AttributeName" /tmp/base.yaml 2>/dev/null | sort || true)
            HEAD_ATTRS=$(yq ".Resources.${table}.Properties.AttributeDefinitions[].AttributeName" /tmp/head.yaml 2>/dev/null | sort || true)
            
            if [ "$BASE_GSIS" != "$HEAD_GSIS" ] || [ "$BASE_ATTRS" != "$HEAD_ATTRS" ]; then
              HAS_GSI_CHANGES=true
              
              # Detect additions and removals for this table
              ADDED=$(comm -13 <(echo "$BASE_GSIS") <(echo "$HEAD_GSIS") || true)
              REMOVED=$(comm -23 <(echo "$BASE_GSIS") <(echo "$HEAD_GSIS") || true)
              
              ATTR_ADDED=$(comm -13 <(echo "$BASE_ATTRS") <(echo "$HEAD_ATTRS") || true)
              ATTR_REMOVED=$(comm -23 <(echo "$BASE_ATTRS") <(echo "$HEAD_ATTRS") || true)
              
              echo "::notice::Table $table - Removing GSIs: $REMOVED"
              echo "::notice::Table $table - Adding GSIs: $ADDED"
              echo "::notice::Table $table - Removing Attrs: $ATTR_REMOVED"
              echo "::notice::Table $table - Adding Attrs: $ATTR_ADDED"
              
              echo "${table}_added<<EOF" >> $GITHUB_OUTPUT
              echo "$ADDED" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
              
              echo "${table}_removed<<EOF" >> $GITHUB_OUTPUT
              echo "$REMOVED" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            fi
          done
          
          echo "has_gsi_changes=$HAS_GSI_CHANGES" >> $GITHUB_OUTPUT

      - name: SAM Build
        run: sam build --template-file infra/trainingPipelineTemplate.yaml

      - name: Deploy with GSI sequencing
        if: steps.gsi_delta.outputs.has_gsi_changes == 'true'
        run: |
          set -euo pipefail
          TPL="infra/trainingPipelineTemplate.yaml"
          
          # Function to wait for table to be ACTIVE
          wait_for_active() {
            local table_logical=$1
            TABLE_NAME=$(aws cloudformation describe-stack-resources \
              --stack-name ${{ env.STACK_NAME }} \
              --query "StackResources[?LogicalResourceId=='${table_logical}'].PhysicalResourceId" \
              --output text 2>/dev/null || echo "")
            
            if [ -n "$TABLE_NAME" ]; then
              echo "Waiting for $TABLE_NAME to be ACTIVE..."
              for i in {1..60}; do
                STATUS=$(aws dynamodb describe-table --table-name "$TABLE_NAME" --query 'Table.TableStatus' --output text 2>/dev/null || echo "UNKNOWN")
                [ "$STATUS" = "ACTIVE" ] && break
                echo "Table status: $STATUS, waiting..."
                sleep 15
              done
              
              if [ "$STATUS" != "ACTIVE" ]; then
                echo "::error::Table $TABLE_NAME failed to become ACTIVE (status: $STATUS)"
                return 1
              fi
              echo "Table $TABLE_NAME is now ACTIVE"
            fi
          }
          
          # Deploy one GSI at a time for each table
          for table in ProcessingStatusTable EEGClassifierTable FBCSPSessionFilesTable; do
            echo "::notice::Processing table: $table"
            
            # Get GSI changes for this table
            ADDED_VAR="${table}_added"
            REMOVED_VAR="${table}_removed"
            
            # Process removals first (one at a time)
            if [ -n "${!REMOVED_VAR:-}" ]; then
              echo "::group::Removing GSIs for $table one by one"
              while IFS= read -r gsi_name; do
                [ -z "$gsi_name" ] && continue
                echo "Removing GSI: $gsi_name from $table"
                
                # Create temporary template with this GSI removed
                yq "del(.Resources.${table}.Properties.GlobalSecondaryIndexes[] | select(.IndexName == \"$gsi_name\"))" "$TPL" > "/tmp/${table}_remove_${gsi_name}.yaml"
                
                sam deploy --template-file "/tmp/${table}_remove_${gsi_name}.yaml" \
                  --parameter-overrides \
                    "SharedApiId=${{ steps.get_exports.outputs.shared_api_id }}" \
                    "EEGUploadBucketName=${{ steps.get_exports.outputs.bucket_name }}" \
                    "PrivateSG=${{ steps.get_exports.outputs.sg_id }}" \
                    "PrivateSubnetId1=${{ steps.get_exports.outputs.subnet1_id }}" \
                    "PrivateSubnetId2=${{ steps.get_exports.outputs.subnet2_id }}" \
                  --no-confirm-changeset --no-fail-on-empty-changeset
                
                wait_for_active "$table"
              done <<< "${!REMOVED_VAR}"
              echo "::endgroup::"
            fi
            
            # Process additions (one at a time)
            if [ -n "${!ADDED_VAR:-}" ]; then
              echo "::group::Adding GSIs for $table one by one"
              while IFS= read -r gsi_name; do
                [ -z "$gsi_name" ] && continue
                echo "Adding GSI: $gsi_name to $table"
                
                # Deploy with just this GSI added
                sam deploy --template-file "$TPL" \
                  --parameter-overrides \
                    "SharedApiId=${{ steps.get_exports.outputs.shared_api_id }}" \
                    "EEGUploadBucketName=${{ steps.get_exports.outputs.bucket_name }}" \
                    "PrivateSG=${{ steps.get_exports.outputs.sg_id }}" \
                    "PrivateSubnetId1=${{ steps.get_exports.outputs.subnet1_id }}" \
                    "PrivateSubnetId2=${{ steps.get_exports.outputs.subnet2_id }}" \
                  --no-confirm-changeset --no-fail-on-empty-changeset
                
                wait_for_active "$table"
              done <<< "${!ADDED_VAR}"
              echo "::endgroup::"
            fi
          done
          
          echo "::notice::All GSI changes completed successfully"

      - name: Standard SAM Deploy
        if: steps.gsi_delta.outputs.has_gsi_changes != 'true'
        run: |
          sam deploy \
            --parameter-overrides \
              "SharedApiId=${{ steps.get_exports.outputs.shared_api_id }}" \
              "EEGUploadBucketName=${{ steps.get_exports.outputs.bucket_name }}" \
              "PrivateSG=${{ steps.get_exports.outputs.sg_id }}" \
              "PrivateSubnetId1=${{ steps.get_exports.outputs.subnet1_id }}" \
              "PrivateSubnetId2=${{ steps.get_exports.outputs.subnet2_id }}" \
            --no-confirm-changeset --no-fail-on-empty-changeset

      - name: Final deployment verification
        if: steps.gsi_delta.outputs.has_gsi_changes == 'true'
        run: |
          sam deploy \
            --parameter-overrides \
              "SharedApiId=${{ steps.get_exports.outputs.shared_api_id }}" \
              "EEGUploadBucketName=${{ steps.get_exports.outputs.bucket_name }}" \
              "PrivateSG=${{ steps.get_exports.outputs.sg_id }}" \
              "PrivateSubnetId1=${{ steps.get_exports.outputs.subnet1_id }}" \
              "PrivateSubnetId2=${{ steps.get_exports.outputs.subnet2_id }}" \
            --no-confirm-changeset --no-fail-on-empty-changeset