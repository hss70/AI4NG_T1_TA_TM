AWSTemplateFormatVersion: "2010-09-09"
Description: EEG Processing Pipeline with Manifest-Driven Workflow
Transform: AWS::Serverless-2016-10-31

Parameters:
  SharedApiId:
    Type: String
    Description: ID of the shared API Gateway
  EEGUploadBucketName:
    Type: String
    Description: Name of the existing EEG upload bucket
  PrivateSG:
    Type: String
    Description: Security group ID for private resources
  PrivateSubnetId1:
    Type: String
    Description: First private subnet ID
  PrivateSubnetId2:
    Type: String
    Description: Second private subnet ID
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]

Resources:
  # S3 Event Rule to trigger Lambda on new uploads. The entry point to this pipeline, triggered when EEG data is uploaded to the S3 bucket.
  S3UploadEventRule:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - "Object Created"
        detail:
          bucket:
            name:
              - !Ref EEGUploadBucketName
          object:
            key:
              - suffix: ".zip"
      Targets:
        - Arn: !GetAtt S3EventProcessorLambda.Arn
          Id: S3UploadEventTarget
  # --- S3 Buckets ---
  EEGResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ai4ng-eeg-results-${AWS::AccountId}-${AWS::Region}
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  EEGResultsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EEGResultsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyUnencryptedUploads
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt EEGResultsBucket.Arn
              - !Sub "${EEGResultsBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # --- DynamoDB Tables ---
  ProcessingStatusTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: EEGProcessingStatus
      AttributeDefinitions:
        - AttributeName: sessionName
          AttributeType: S
        - AttributeName: sessionId
          AttributeType: N
      KeySchema:
        - AttributeName: sessionName
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: SessionIdIndex
          KeySchema:
            - AttributeName: sessionId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiry
        Enabled: true
  ProcessingStatusTableV2:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: EEGProcessingStatusV2
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: N
        - AttributeName: sessionName
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: SessionNameIndex
          KeySchema:
            - AttributeName: sessionName
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiry
        Enabled: true

  EEGClassifierTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: FBCSPClassifierParameters
      AttributeDefinitions:
        - AttributeName: classifierId
          AttributeType: N
        - AttributeName: sessionId
          AttributeType: N
        - AttributeName: userId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: classifierId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdTimestampIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: SessionIdTimestampIndex
          KeySchema:
            - AttributeName: sessionId
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  FBCSPSessionFilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: FBCSPSessionFiles
      AttributeDefinitions:
        - AttributeName: sessionName
          AttributeType: S
        - AttributeName: filePath
          AttributeType: S
        - AttributeName: sessionId
          AttributeType: N
        - AttributeName: userId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: N
        - AttributeName: extension
          AttributeType: S
        - AttributeName: fileName
          AttributeType: S
      KeySchema:
        - AttributeName: sessionName
          KeyType: HASH
        - AttributeName: filePath
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: SessionIdIndex
          KeySchema:
            - AttributeName: sessionId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: UserIdCreatedAtIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: DateIndex
          KeySchema:
            - AttributeName: createdAt
              KeyType: HASH
            - AttributeName: sessionId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: SessionIdExtensionIndex
          KeySchema:
            - AttributeName: sessionId
              KeyType: HASH
            - AttributeName: extension
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: SessionIdFileNameIndex
          KeySchema:
            - AttributeName: sessionId
              KeyType: HASH
            - AttributeName: fileName
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  DeviceTokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-DeviceTokens"
      AttributeDefinitions:
        - AttributeName: deviceId
          AttributeType: S
        - AttributeName: lastUserId
          AttributeType: S
      KeySchema:
        - AttributeName: deviceId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: userIdIndex
          KeySchema:
            - AttributeName: lastUserId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # --- API Gateway Integration ---
  RegisterDeviceIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref SharedApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RegisterDeviceLambda.Arn}/invocations
      PayloadFormatVersion: "2.0"
      IntegrationMethod: POST

  StatusIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref SharedApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetStatusLambda.Arn}/invocations
      PayloadFormatVersion: "2.0"
      IntegrationMethod: POST

  StatusRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SharedApiId
      RouteKey: "GET /api/status/{sessionId}"
      AuthorizationType: JWT
      AuthorizerId: !ImportValue SharedApiAuthorizerId
      Target: !Sub integrations/${StatusIntegration}

  StatusAllRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SharedApiId
      RouteKey: "GET /api/status"
      AuthorizationType: JWT
      AuthorizerId: !ImportValue SharedApiAuthorizerId
      Target: !Sub integrations/${StatusIntegration}

  DeviceRegisterRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SharedApiId
      RouteKey: "POST /device/register"
      AuthorizationType: JWT
      AuthorizerId: !ImportValue SharedApiAuthorizerId
      Target: !Sub integrations/${RegisterDeviceIntegration}

  DeviceGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SharedApiId
      RouteKey: "GET /device/register"
      AuthorizationType: JWT
      AuthorizerId: !ImportValue SharedApiAuthorizerId
      Target: !Sub integrations/${RegisterDeviceIntegration}

  # --- CloudWatch Log Groups ---
  S3EventProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-S3EventProcessor
      RetentionInDays: 14

  GetStatusLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-GetStatus
      RetentionInDays: 14

  ManifestProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-ManifestProcessor
      RetentionInDays: 14

  ClassifierProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-ClassifierProcessor
      RetentionInDays: 14

  ResultsMetadataLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-ResultsMetadata
      RetentionInDays: 14

  RegisterDeviceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-RegisterDevice
      RetentionInDays: 14

  # --- Lambda Functions ---
  # S3 Event Processor Lambda
  S3EventProcessorLambda:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.handler
      Runtime: nodejs22.x
      CodeUri: ../src/lambdas/s3EventProcessor/
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref ProcessingStateMachine
          STATUS_TABLE: !Ref ProcessingStatusTableV2
      Policies:
        - Statement:
            - Effect: Allow
              Action: states:StartExecution
              Resource: !Ref ProcessingStateMachine
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
                - dynamodb:PutItem
              Resource: !GetAtt ProcessingStatusTableV2.Arn
        - S3ReadPolicy:
            BucketName: !Ref EEGUploadBucketName
        - CloudWatchLogsFullAccess
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref S3EventProcessorLogGroup

  # Permission for EventBridge to invoke Lambda
  S3EventLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt S3EventProcessorLambda.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt S3UploadEventRule.Arn

  GetStatusLambda:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/lambdas/statusCheck/
      Handler: app.handler
      Runtime: nodejs22.x
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          STATUS_TABLE: !Ref ProcessingStatusTableV2
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ProcessingStatusTableV2
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:Query
              Resource:
                - !GetAtt ProcessingStatusTableV2.Arn
                - !Sub "${ProcessingStatusTableV2.Arn}/index/*"
            - Effect: Allow
              Action:
                - logs:FilterLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/eeg-classifier:*"
        - CloudWatchLogsFullAccess
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref GetStatusLogGroup

  GetStatusLambdaPermissions:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt GetStatusLambda.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SharedApiId}/*/GET/api/status/*"

  RegisterDeviceLambdaPermissions:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt RegisterDeviceLambda.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SharedApiId}/*/*/device/register"

  # Manifest Processor Lambda
  ManifestProcessorLambda:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/lambdas/manifestProcessor/
      Handler: app.handler
      Runtime: nodejs22.x
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          STATUS_TABLE: !Ref ProcessingStatusTableV2
          FILES_TABLE: !Ref FBCSPSessionFilesTable
          SNS_TOPIC_ARN: !Ref ProcessingNotificationTopic
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref ProcessingStatusTableV2
        - DynamoDBWritePolicy:
            TableName: !Ref FBCSPSessionFilesTable
        - S3ReadPolicy:
            BucketName: !Ref EEGResultsBucket
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt ProcessingNotificationTopic.TopicName
        - CloudWatchLogsFullAccess
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref ManifestProcessorLogGroup

  # Classifier Processor Lambda
  ClassifierProcessorLambda:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/lambdas/classifierProcessor/
      Handler: app.handler
      Runtime: nodejs22.x
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          CLASSIFIER_TABLE: !Ref EEGClassifierTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref EEGClassifierTable
        - S3ReadPolicy:
            BucketName: !Ref EEGResultsBucket
        - CloudWatchLogsFullAccess
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref ClassifierProcessorLogGroup

  # Results Metadata Lambda
  ResultsMetadataLambda:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/lambdas/resultsMetadata/
      Handler: app.handler
      Runtime: nodejs22.x
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          STATUS_TABLE: !Ref ProcessingStatusTableV2
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref ProcessingStatusTableV2
        - S3ReadPolicy:
            BucketName: !Ref EEGResultsBucket
        - CloudWatchLogsFullAccess
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref ResultsMetadataLogGroup

  AdminRetriggerLambda:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/lambdas/adminRetrigger/
      Handler: app.handler
      Runtime: nodejs22.x
      Timeout: 300
      MemorySize: 256
      Environment:
        Variables:
          STATUS_TABLE: !Ref ProcessingStatusTableV2
          STATE_MACHINE_ARN: !Ref ProcessingStateMachine
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ProcessingStatusTableV2
        - Statement:
            - Effect: Allow
              Action: states:StartExecution
              Resource: !Ref ProcessingStateMachine
        - CloudWatchLogsFullAccess

  RegisterDeviceLambda:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/lambdas/deviceRegistration/
      Handler: app.handler
      Runtime: nodejs22.x
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          DEVICE_TABLE: !Ref DeviceTokensTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DeviceTokensTable
        - CloudWatchLogsFullAccess
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref RegisterDeviceLogGroup

  ProcessingNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: EEGProcessingNotifications
      DisplayName: EEG Processing Notifications
      Subscription:
        - Protocol: email
          Endpoint: "hss70@bath.ac.uk"

  # Topic to broadcast that a classifier is ready; subscribers can bridge to Android via FCM
  ClassifierReadyTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: EEGClassifierReady
      DisplayName: EEG Classifier Ready Notifications

  StatusQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: EEG-Status-Queue

  # --- CloudWatch Alarms ---
  StepFunctionFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-StepFunction-Failures
      AlarmDescription: Alert when Step Function executions fail
      MetricName: ExecutionsFailed
      Namespace: AWS/States
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref ProcessingStateMachine
      AlarmActions:
        - !Ref ProcessingNotificationTopic

  ECSTaskFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-ECS-Task-Failures
      AlarmDescription: Alert when ECS tasks fail
      MetricName: TasksStoppedReason
      Namespace: AWS/ECS
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: ClusterName
          Value: !Ref EEGFargateCluster
      AlarmActions:
        - !Ref ProcessingNotificationTopic

  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-Lambda-Errors
      AlarmDescription: Alert when Lambda functions error
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref ProcessingNotificationTopic

  # --- CloudWatch Dashboard ---
  EEGProcessingDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${AWS::StackName}-EEG-Processing-Pipeline
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/States", "ExecutionsStarted", "StateMachineArn", "${ProcessingStateMachine}" ],
                  [ ".", "ExecutionsSucceeded", ".", "." ],
                  [ ".", "ExecutionsFailed", ".", "." ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Step Function Executions",
                "period": 300
              }
            },
            {
              "type": "log",
              "x": 0,
              "y": 6,
              "width": 24,
              "height": 6,
              "properties": {
                "query": "SOURCE '/aws/lambda/AI4NGUploadLambda'\nSOURCE '/aws/lambda/${AWS::StackName}-S3EventProcessor'\nSOURCE '/aws/lambda/${AWS::StackName}-ManifestProcessor'\nSOURCE '/aws/lambda/${AWS::StackName}-ClassifierProcessor'\nSOURCE '/ecs/eeg-classifier'\nSOURCE '/aws/stepfunctions/${AWS::StackName}-ProcessingStateMachine'\n| fields @timestamp, level, message, sessionId, sessionName, userId\n| filter ispresent(sessionId)\n| sort @timestamp desc\n| limit 100",
                "region": "${AWS::Region}",
                "title": "Session Logs (Filter by sessionId)",
                "view": "table"
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 12,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/ECS", "CPUUtilization", "ClusterName", "${EEGFargateCluster}" ],
                  [ ".", "MemoryUtilization", ".", "." ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "ECS Resource Utilization",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 12,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Lambda", "Duration", "FunctionName", "${S3EventProcessorLambda}" ],
                  [ ".", "Errors", ".", "." ],
                  [ ".", "Invocations", ".", "." ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Lambda Performance",
                "period": 300
              }
            }
          ]
        }

  # --- IAM Roles ---
  EEGTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${EEGUploadBucketName}"
                  - !Sub "arn:aws:s3:::${EEGUploadBucketName}/*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectAcl
                Resource:
                  - !GetAtt EEGResultsBucket.Arn
                  - !Sub "${EEGResultsBucket.Arn}/*"
        - PolicyName: DynamoDBStatusUpdate
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                Resource: !GetAtt ProcessingStatusTableV2.Arn
        - PolicyName: ECRAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: "*"

  # --- Step Function Execution Role ---
  EEGStepFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFunctionExecutionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt ClassifierProcessorLambda.Arn
                  - !GetAtt ResultsMetadataLambda.Arn
                  - !GetAtt ManifestProcessorLambda.Arn
              - Effect: Allow
                Action:
                  - ecs:RunTask
                  - ecs:StopTask
                  - ecs:DescribeTasks
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt EEGTaskExecutionRole.Arn
              - Effect: Allow
                Action:
                  - events:PutTargets
                  - events:PutRule
                  - events:DescribeRule
                Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctions*
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${EEGUploadBucketName}/*"
              - Effect: Allow
                Action:
                  - s3:HeadObject
                  - s3:GetObject
                Resource: !Sub "${EEGResultsBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt EEGResultsBucket.Arn
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt ProcessingStatusTableV2.Arn
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref ClassifierReadyTopic
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: "*"

  # --- ECS Resources ---
  EEGFargateCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: EEG-Classifier-Cluster
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Configuration:
        ExecuteCommandConfiguration:
          Logging: DEFAULT

  ClassifierLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/eeg-classifier
      RetentionInDays: 30

  ClassifierECR:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: eeg-classifier
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 10 images",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["v"],
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }

  EEGFargateTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: EEGClassifierTask
      Cpu: "1024"
      Memory: "4096"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt EEGTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt EEGTaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: eeg-classifier
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ClassifierECR}:latest
          Essential: true
          Environment:
            - Name: UPLOAD_BUCKET
              Value: !Ref EEGUploadBucketName
            - Name: RESULTS_BUCKET
              Value: !Ref EEGResultsBucket
            - Name: STATUS_TABLE
              Value: !Ref ProcessingStatusTableV2
            - Name: CLASSIFIER_TABLE
              Value: !Ref EEGClassifierTable
            - Name: PRIVATE_SG
              Value: !Ref PrivateSG
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ClassifierLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: eeg-classifier

  # --- CloudWatch Log Groups for Step Functions ---
  StepFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/stepfunctions/${AWS::StackName}-ProcessingStateMachine
      RetentionInDays: 30

  # --- Step Functions ---
  ProcessingStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionUri: EEGProcessingStateMachine.asl.json
      DefinitionSubstitutions:
        ProcessingStatusTable: !Ref ProcessingStatusTableV2
        EEGFargateCluster: !GetAtt EEGFargateCluster.Arn
        EEGFargateTaskDefinition: !Ref EEGFargateTaskDefinition
        PrivateSG: !Ref PrivateSG
        PrivateSubnetId1: !Ref PrivateSubnetId1
        PrivateSubnetId2: !Ref PrivateSubnetId2
        ManifestProcessorLambdaArn: !GetAtt ManifestProcessorLambda.Arn
        ClassifierProcessorLambdaArn: !GetAtt ClassifierProcessorLambda.Arn
        ResultsMetadataLambdaArn: !GetAtt ResultsMetadataLambda.Arn
        ResultsBucket: !Ref EEGResultsBucket
        ClassifierReadyTopicArn: !Ref ClassifierReadyTopic
      Role: !GetAtt EEGStepFunctionRole.Arn
      Logging:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StepFunctionLogGroup.Arn
      Tracing:
        Enabled: true
      Tags:
        AI4NG: "true"
        TrainingPipeline: "true"

Outputs:
  StatusApiUrl:
    Value: !Sub https://${SharedApiId}.execute-api.${AWS::Region}.amazonaws.com/dev/api/status/
    Description: URL for status checking API
    Export:
      Name: EEGStatusApiUrl
  ProcessingStatusTable:
    Value: !Ref ProcessingStatusTableV2
    Description: Name of the processing status DynamoDB table
    Export:
      Name: ProcessingStatusTableName
  ResultsBucketName:
    Value: !Ref EEGResultsBucket
    Export:
      Name: EEGResultsBucketName
  ECRRepositoryUri:
    Value: !GetAtt ClassifierECR.RepositoryUri
    Description: URI for the ECR repository containing the classifier image
    Export:
      Name: EEGClassifierECRUri
  ProcessingStateMachineArn:
    Value: !Ref ProcessingStateMachine
    Description: ARN of the EEG processing state machine
    Export:
      Name: EEGProcessingStateMachineArn

  ClassifierReadyTopicArn:
    Value: !Ref ClassifierReadyTopic
    Description: ARN for the SNS topic that receives classifier-ready notifications
    Export:
      Name: EEGClassifierReadyTopicArn
  DashboardUrl:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${AWS::StackName}-EEG-Processing-Pipeline
    Description: URL to the CloudWatch Dashboard
    Export:
      Name: EEGProcessingDashboardUrl
  LogInsightsQuery:
    Value: !Sub |
      SOURCE '/aws/lambda/AI4NGUploadLambda'
      SOURCE '/aws/lambda/${AWS::StackName}-S3EventProcessor'
      SOURCE '/aws/lambda/${AWS::StackName}-ManifestProcessor'
      SOURCE '/aws/lambda/${AWS::StackName}-ClassifierProcessor'
      SOURCE '/ecs/eeg-classifier'
      | fields @timestamp, level, message, sessionId, sessionName, userId, error
      | filter sessionId = "YOUR_SESSION_ID"
      | sort @timestamp asc
    Description: CloudWatch Logs Insights query to track sessionId across all services
  S3EventProcessorLambdaName:
    Value: !Ref S3EventProcessorLambda
    Description: Name of S3 event processor Lambda
    Export:
      Name: S3EventProcessorLambdaName
  DeviceTokensTableName:
    Value: !Ref DeviceTokensTable
    Description: Name of the device tokens DynamoDB table
    Export:
      Name: DeviceTokensTableName
  DeviceRegistrationApiUrl:
    Value: !Sub https://${SharedApiId}.execute-api.${AWS::Region}.amazonaws.com/dev/device/register
    Description: URL for device registration API
    Export:
      Name: DeviceRegistrationApiUrl
